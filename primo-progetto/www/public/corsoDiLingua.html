<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Corso di lingua</title>
</head>
<body>
	<form action="corsoDiLingua.php" method="post">

	<h1>Corso di lingua</h1>

	<form id = "form">
		<fieldset>
			<label for="cognome">Cognome:</label><br>
			<input type="text" id="cognome" name="cognome">
		</fieldset>
		<br>
		<fieldset>
			<label for="nome">Nome:</label><br>
			<input type="text" id="nome" name="nome">
		</fieldset>
		<br>
		<fieldset>
			<label for="email">Email:</label><br>
			<input type="email" id="email" name="email">
		</fieldset>
		<br>
		<fieldset>
			<label for="select">Lingua:</label><br>
			<select  id="select" name="select">
				<option value="Ita">Italiano</option>
				<option value="Eng">Inglese</option>
				<option value="Fra">Francese</option>
			</select>
		</fieldset>
		<br>
		<fieldset>
			<label>Livello:</label><br>
			<input type="radio" id="base" name="livello" value="base" required checked>
			<label for="base">Base</label>
			<br>
			
			<input type="radio" id="intermedio" name="livello" value="intermedio">
			<label for="intermedio">Intermedio</label>
			<br>
			
			<input type="radio" id="avanzato" name="livello" value="avanzato">
			<label for="avanzato">Avanzato</label>
			<br>
		</fieldset>
		<br>
		<fieldset>
			<label>Preferenza orario:</label><br>
			<label for="mattina">Mattina</label>
			<input type="checkbox" id="mattina" name="check">
			<br>
			
			<label for="pomeriggio">Pomeriggio</label>
			<input type="checkbox" id="pomeriggio" name="check">
			<br>
			
			<label for="sera">Sera</label>
			<input type="checkbox" id="sera" name="check">
			<br>
		</fieldset>
		<br>
		<fieldset>
			<label for="messaggio">Altre richieste:</label><br>
			<textarea id="messaggio" name="messaggio" rows="5" cols="30"></textarea>
		</fieldset>
		
		<button type="submit">Invia</button>
		<button type="remove">Reset</button>
	</form>

</body>
</html>
